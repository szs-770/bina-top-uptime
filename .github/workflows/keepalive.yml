# GitHub pauses scheduled workflows in a public repository after 60 days without commits.
# An empty commit once a month keeps the uptime check running.
name: keepalive

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Empty commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m 'keepalive: keep the scheduled uptime check active'
          git push
